name: Backend CI/CD

# main  ──► test (PHP 8.4 + MariaDB 11.8) ──► build assets ──► promote to "production" branch
#                                                      └► IONOS cron (deploy/ionos/pull-deploy.sh)
#                                                         installs it within ~1 minute ──► smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an older run instead of queueing behind it.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  LIVE_URL: https://femalerider.mytechrcm.com

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Same engine as IONOS production (MariaDB 11.8)
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: femalerider_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: femalerider_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, exif, sodium
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build front-end assets (website views need the Vite manifest)
        run: |
          npm ci
          npm run build

      - name: Keep the built assets for the release job
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 3

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')|" .env

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Test suite (Redis-less, shared-hosting mode included)
        run: php artisan test
        env:
          PRESENCE_DRIVER: sql

  release:
    name: Promote to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse the assets built by the test job
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Push release commit to the production branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B production
          git add -f public/build
          git commit -m "release: ${GITHUB_SHA::12}" || echo "no asset changes"
          git push --force origin production
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Tell the server to deploy now (cron is the fallback)
        run: curl -fsS -X POST "$LIVE_URL/api/v1/deploy/notify" || echo "notify failed — the every-minute cron will deploy"

      - name: Wait for IONOS to deploy and smoke-test
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "$LIVE_URL/api/v1/health" | sed -n 's/.*"revision":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$live" = "$RELEASE_SHA" ]; then echo "Live revision $live after $((i*5))s"; break; fi
            echo "waiting for deploy ($i/60) live=${live:-none}"; sleep 5
          done
          [ "$live" = "$RELEASE_SHA" ] || { echo "::error::Release not live after 5 minutes — check storage/logs/deploy.log on the server"; exit 1; }
          curl -fsS "$LIVE_URL/up" >/dev/null
          curl -fsS "$LIVE_URL/api/v1/config" | grep -q '"currency"'
          curl -fsS -o /dev/null -w '%{http_code}\n' "$LIVE_URL/" | grep -q 200
